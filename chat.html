<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MUN // Chat</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap');
  
  :root {
    --bg: #050505;
    --sidebar-bg: #0a0a0a;
    --surface: #111111;
    --surface-hover: #1a1a1a;
    --border: #222222;
    --text: #ededed;
    --text-muted: #888888;
    --accent: #ffffff;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body { 
    font-family: 'Inter', sans-serif; 
    background: var(--bg); 
    color: var(--text); 
    height: 100vh; 
    display: flex; 
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* --- ПРЕЛОАДЕР (ПРОСТОЙ И ЭЛЕГАНТНЫЙ) --- */
  .preloader {
    position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
    background: var(--bg); z-index: 9999;
    display: flex; align-items: center; justify-content: center;
    transition: opacity 1.2s ease, visibility 1.2s ease;
  }
  
  .preloader.hidden {
    opacity: 0; visibility: hidden;
  }

  .preloader-content {
    display: flex; flex-direction: column; align-items: center; gap: 32px;
    position: relative;
  }

  /* Мягкое круглое сияние под иконкой (без квадратов) */
  .glow-bg {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 300px; height: 300px;
    background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0) 70%);
    border-radius: 50%;
    opacity: 0;
    transition: opacity 1.5s ease;
    pointer-events: none;
    z-index: -1;
  }

  .preloader.show-icon .glow-bg {
    opacity: 1;
  }

  /* Наша идеальная иконка (в большом размере) */
  .big-icon {
    width: 180px; height: 180px;
    opacity: 0;
    transform: scale(0.85);
    transition: opacity 1.5s ease, transform 1.5s cubic-bezier(0.2, 0.8, 0.2, 1);
    /* Свечение через drop-shadow, без обрезки */
    filter: drop-shadow(0 0 30px rgba(255,255,255,0.15));
    z-index: 1;
  }

  .preloader.show-icon .big-icon {
    opacity: 1;
    transform: scale(1);
  }

  .preloader.show-eyes .big-eye {
    opacity: 1;
    filter: drop-shadow(0 0 15px #fff);
  }

  .big-eye {
    opacity: 0;
    transition: opacity 1.2s ease, filter 1.2s ease;
    fill: #ffffff;
  }

  .big-text {
    font-family: 'JetBrains Mono', monospace;
    font-size: 14px; letter-spacing: 6px; color: var(--text-muted);
    text-transform: uppercase;
    opacity: 0;
    transition: opacity 1.5s ease 0.8s;
    z-index: 1;
  }

  .preloader.show-icon .big-text {
    opacity: 1;
  }

  /* --- 3D ЛИНИИ НА ФОНЕ --- */
  .bg-canvas {
    position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
    z-index: -1; overflow: hidden; pointer-events: none;
    background: radial-gradient(circle at 50% 0%, rgba(255, 255, 255, 0.03) 0%, transparent 60%);
  }
  .line {
    position: absolute;
    border: 2px solid rgba(255, 255, 255, 0.15);
    border-radius: 50%;
    box-shadow: 0 0 20px rgba(255, 255, 255, 0.05);
    filter: blur(1px);
  }
  .line-1 {
    width: 800px; height: 800px;
    top: -200px; left: -200px;
    border-width: 40px;
    border-color: rgba(255, 255, 255, 0.05);
    animation: drift1 25s infinite alternate ease-in-out;
  }
  .line-2 {
    width: 600px; height: 600px;
    bottom: -100px; right: -100px;
    border-width: 30px;
    border-color: rgba(255, 255, 255, 0.08);
    animation: drift2 30s infinite alternate ease-in-out;
  }
  .line-3 {
    width: 400px; height: 400px;
    top: 40%; left: 60%;
    border-width: 10px;
    border-color: rgba(255, 255, 255, 0.1);
    animation: drift3 20s infinite alternate ease-in-out;
  }

  @keyframes drift1 {
    0% { transform: translate(0, 0) rotate(0deg) scale(1); }
    100% { transform: translate(100px, 50px) rotate(15deg) scale(1.1); }
  }
  @keyframes drift2 {
    0% { transform: translate(0, 0) rotate(0deg); }
    100% { transform: translate(-80px, -60px) rotate(-20deg); }
  }
  @keyframes drift3 {
    0% { transform: translate(0, 0) scale(1); }
    100% { transform: translate(-50px, 100px) scale(1.2); }
  }

  /* --- САЙДБАР (Появление) --- */
  .sidebar {
    width: 260px;
    background: var(--sidebar-bg);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    transition: transform 1.2s cubic-bezier(0.2, 0.8, 0.2, 1);
    z-index: 20;
    transform: translateX(-100%);
  }
  
  .sidebar.visible {
    transform: translateX(0);
  }
  
  .sidebar-header {
    padding: 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .logo-area {
    font-family: 'JetBrains Mono', monospace;
    font-size: 16px; 
    font-weight: 600; 
    letter-spacing: 2px; 
    text-transform: uppercase; 
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--text);
  }

  .new-chat-btn {
    background: var(--surface); border: 1px solid var(--border);
    color: var(--text); border-radius: 8px; padding: 10px;
    font-size: 13px; font-weight: 500; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    transition: 0.2s;
  }
  .new-chat-btn:hover { background: var(--surface-hover); border-color: #444; }

  .chat-list {
    flex: 1; overflow-y: auto; padding: 12px;
    display: flex; flex-direction: column; gap: 4px;
  }
  .chat-item {
    padding: 10px 12px; border-radius: 8px; cursor: pointer;
    font-size: 14px; color: var(--text-muted); transition: 0.2s;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    display: flex; justify-content: space-between; align-items: center;
  }
  .chat-item:hover { background: var(--surface); color: var(--text); }
  .chat-item.active { background: var(--surface); color: var(--text); border-left: 2px solid #fff; }
  .chat-item .delete-btn {
    opacity: 0; font-size: 16px; color: #555; transition: 0.2s;
  }
  .chat-item:hover .delete-btn { opacity: 1; }
  .chat-item .delete-btn:hover { color: #ff4d4d; }

  .user-profile {
    padding: 16px; border-top: 1px solid var(--border);
    display: flex; align-items: center; gap: 12px; cursor: pointer;
  }
  .user-profile:hover { background: var(--surface); }
  .user-avatar {
    width: 32px; height: 32px; border-radius: 50%;
    background: #333; display: flex; align-items: center; justify-content: center;
    font-size: 14px; font-weight: 600; color: #fff;
  }
  .user-info { display: flex; flex-direction: column; }
  .user-name { font-size: 14px; font-weight: 500; }
  .user-status { font-size: 11px; color: var(--text-muted); }

  /* --- ОСНОВНОЙ КОНТЕНТ (Появление) --- */
  .main-content {
    flex: 1; display: flex; flex-direction: column;
    position: relative; z-index: 1;
    opacity: 0;
    transition: opacity 1.5s ease-in 0.5s;
  }

  .main-content.visible {
    opacity: 1;
  }

  header { 
    padding: 16px 24px; 
    background: rgba(5, 5, 5, 0.5);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border); 
    display: flex; 
    justify-content: space-between;
    align-items: center;
  }
  .nav-link {
    color: var(--text-muted); text-decoration: none;
    font-family: 'JetBrains Mono', monospace; font-size: 12px;
    font-weight: 500; transition: all 0.2s ease; text-transform: uppercase;
  }
  .nav-link:hover { color: #fff; text-shadow: 0 0 10px rgba(255,255,255,0.3); }

  /* ЧАТ */
  #messages { 
    flex: 1; overflow-y: auto; padding: 32px 24px; 
    display: flex; flex-direction: column; gap: 24px; 
    max-width: 800px; margin: 0 auto; width: 100%;
  }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
  
  .msg-wrapper { display: flex; gap: 16px; max-width: 100%; animation: fadeIn 0.4s ease-out; }
  .msg-wrapper.user { justify-content: flex-end; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  .avatar {
    width: 32px; height: 32px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 600;
  }
  .avatar.bot { background: #111; color: #000; border: 1px solid #333; }
  .avatar.user { background: #333; color: #fff; }

  .msg { padding: 12px 0; line-height: 1.6; font-size: 15px; word-wrap: break-word; color: var(--text); }
  .msg.bot { flex: 1; }
  .msg.user {
    background: var(--surface); padding: 14px 20px;
    border-radius: 16px; border-top-right-radius: 4px;
    max-width: 80%; border: 1px solid var(--border);
  }

  /* АНИМАЦИЯ ПЕЧАТИ */
  .typing-indicator { display: flex; align-items: center; gap: 4px; height: 20px; margin-top: 8px; }
  .typing-indicator span {
    display: block; width: 6px; height: 6px;
    background-color: var(--text-muted); border-radius: 50%;
    animation: bounce 1.4s infinite ease-in-out both;
  }
  .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
  .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
  @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }

  .msg.bot blockquote { 
    border-left: 2px solid #fff; background: rgba(255,255,255,0.03); 
    padding: 12px 16px; margin: 12px 0; font-size: 14px; color: #bbb; border-radius: 0 4px 4px 0;
  }
  .msg.bot a { color: #fff; text-decoration: underline; text-underline-offset: 2px; }
  .msg.bot a:hover { color: #aaa; }

  /* ВВОД */
  .input-container { 
    background: linear-gradient(180deg, transparent 0%, var(--bg) 50%);
    padding: 24px; 
  }
  .input-wrapper { 
    max-width: 800px; margin: 0 auto; 
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 16px; padding: 8px 16px;
    display: flex; flex-direction: column; gap: 8px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    transition: border-color 0.3s ease;
  }
  .input-wrapper:focus-within { border-color: #444; }
  #prompt { 
    width: 100%; background: transparent; color: #fff; border: none;
    padding: 12px 0; font-size: 15px; font-family: inherit;
    resize: none; min-height: 24px; max-height: 200px; 
  }
  #prompt:focus { outline: none; }
  
  .controls { display: flex; justify-content: space-between; align-items: center; padding-bottom: 8px; }
  
  .mode-switch { 
    display: flex; align-items: center; gap: 8px; cursor: pointer; 
    user-select: none; padding: 4px 8px; border-radius: 6px; transition: 0.2s;
  }
  .mode-switch:hover { background: rgba(255,255,255,0.05); }
  .mode-switch .slider { 
    width: 28px; height: 16px; background: #333; border-radius: 20px; 
    position: relative; transition: 0.3s; 
  }
  .mode-switch .slider::after { 
    content: ''; width: 12px; height: 12px; background: #777; 
    border-radius: 50%; position: absolute; top: 2px; left: 2px; transition: 0.3s; 
  }
  .mode-switch.active .slider { background: #fff; }
  .mode-switch.active .slider::after { transform: translateX(12px); background: #000; }
  .mode-switch label { 
    font-family: 'JetBrains Mono', monospace; font-size: 11px; font-weight: 500; 
    color: var(--text-muted); cursor: pointer; text-transform: uppercase; letter-spacing: 1px;
  }
  .mode-switch.active label { color: #fff; }

  .action-buttons { display: flex; gap: 12px; align-items: center; }
  .attach-btn { 
    background: transparent; border: 1px solid var(--border); border-radius: 50%; 
    width: 36px; height: 36px; cursor: pointer; display: flex; 
    align-items: center; justify-content: center; font-size: 16px; 
    transition: 0.2s; color: var(--text-muted);
  }
  .attach-btn:hover { background: var(--surface-hover); color: #fff; border-color: #444; }
  
  button#send { 
    background: #fff; color: #000; border: none; border-radius: 8px; 
    width: 36px; height: 36px; cursor: pointer; display: flex;
    align-items: center; justify-content: center; transition: all 0.2s ease; 
  }
  button#send::after { content: '↑'; font-size: 20px; font-weight: 700; }
  button#send:hover { background: #ccc; }
  button#send:disabled { background: #222; color: #555; cursor: not-allowed; }

  /* --- МОДАЛКА РЕГИСТРАЦИИ --- */
  .modal-overlay {
    position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
    background: rgba(0,0,0,0.8); backdrop-filter: blur(5px);
    display: none; align-items: center; justify-content: center; z-index: 100;
  }
  .modal-overlay.active { display: flex; }
  .auth-modal {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 16px; padding: 32px; width: 100%; max-width: 400px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.8);
    animation: fadeIn 0.3s ease-out;
  }
  .auth-modal h2 { font-size: 20px; margin-bottom: 24px; text-align: center; font-family: 'JetBrains Mono', monospace;}
  .auth-input {
    width: 100%; background: var(--bg); border: 1px solid var(--border);
    border-radius: 8px; padding: 12px; color: #fff; margin-bottom: 16px;
    font-size: 14px; outline: none; transition: 0.2s;
  }
  .auth-input:focus { border-color: #666; }
  .auth-submit {
    width: 100%; background: #fff; color: #000; border: none;
    border-radius: 8px; padding: 12px; font-size: 14px; font-weight: 600;
    cursor: pointer; transition: 0.2s;
  }
  .auth-submit:hover { background: #ccc; }
  .auth-switch { text-align: center; font-size: 13px; color: var(--text-muted); margin-top: 16px; }
  .auth-switch span { color: #fff; cursor: pointer; text-decoration: underline; }
</style>
</head>
<body>

<!-- ПРЕЛОАДЕР -->
<div class="preloader" id="preloader">
  <div class="preloader-content">
    <!-- Круглое мягкое свечение (градиент) -->
    <div class="glow-bg"></div>
    
    <svg class="big-icon" id="bigIcon" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="2" y="18" width="6" height="12" rx="2" fill="#333" />
      <rect x="40" y="18" width="6" height="12" rx="2" fill="#333" />
      <rect x="4" y="21" width="2" height="6" rx="1" fill="#fff" />
      <rect x="42" y="21" width="2" height="6" rx="1" fill="#fff" />
      <rect x="8" y="12" width="32" height="24" rx="8" fill="#e0e0e0" />
      <rect x="10" y="14" width="28" height="20" rx="6" fill="#050505" />
      <rect class="big-eye" x="14" y="20" width="7" height="7" rx="2" fill="#ffffff" />
      <rect class="big-eye" x="27" y="20" width="7" height="7" rx="2" fill="#ffffff" />
      <path d="M14 16C20 14 28 14 34 16" stroke="#333" stroke-width="1.5" stroke-linecap="round" />
    </svg>
    <div class="big-text">MUN SYSTEM</div>
  </div>
</div>

<!-- 3D ФОН -->
<div class="bg-canvas">
  <div class="line line-1"></div>
  <div class="line line-2"></div>
  <div class="line line-3"></div>
</div>

<!-- БОКОВАЯ ПАНЕЛЬ -->
<div class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <div class="logo-area">
      <svg width="32" height="32" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg" style="filter: drop-shadow(0 0 8px rgba(255,255,255,0.3));">
        <rect x="2" y="18" width="6" height="12" rx="2" fill="#333" />
        <rect x="40" y="18" width="6" height="12" rx="2" fill="#333" />
        <rect x="4" y="21" width="2" height="6" rx="1" fill="#fff" />
        <rect x="42" y="21" width="2" height="6" rx="1" fill="#fff" />
        <rect x="8" y="12" width="32" height="24" rx="8" fill="#e0e0e0" />
        <rect x="10" y="14" width="28" height="20" rx="6" fill="#050505" />
        <rect x="14" y="20" width="7" height="7" rx="2" fill="#ffffff" />
        <rect x="27" y="20" width="7" height="7" rx="2" fill="#ffffff" />
        <path d="M14 16C20 14 28 14 34 16" stroke="#333" stroke-width="1.5" stroke-linecap="round" />
      </svg>
      MUN
    </div>
    <button class="new-chat-btn" id="newChatBtn">
      <span>+</span> Новый чат
    </button>
  </div>
  <div class="chat-list" id="chatList">
    <!-- Список чатов -->
  </div>
  <div class="user-profile" id="userProfile">
    <div class="user-avatar" id="userAvatar">U</div>
    <div class="user-info">
      <div class="user-name" id="profileName">Гость</div>
      <div class="user-status" id="profileStatus">Нажмите для входа</div>
    </div>
  </div>
</div>

<!-- ОСНОВНОЙ КОНТЕНТ -->
<div class="main-content" id="mainContent">
  <header>
    <div></div>
    <a href="dashboard.html" class="nav-link">[ API DASHBOARD ]</a>
  </header>

  <div id="messages"></div>

  <div class="input-container">
    <div class="input-wrapper">
      <textarea id="prompt" placeholder="Задайте вопрос..."></textarea>
      <div class="controls">
        <div class="mode-switch" id="lawyerSwitch">
          <div class="slider"></div>
          <label>Режим Юриста</label>
        </div>
        <div class="action-buttons">
          <label for="pdfUpload" class="attach-btn" title="Загрузить PDF">📎</label>
          <input type="file" id="pdfUpload" accept=".pdf" style="display: none;">
          <button id="send"></button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- МОДАЛКА РЕГИСТРАЦИИ -->
<div class="modal-overlay" id="authModal">
  <div class="auth-modal">
    <h2 id="authTitle">Вход</h2>
    <input type="text" class="auth-input" id="authLogin" placeholder="Логин">
    <input type="password" class="auth-input" id="authPassword" placeholder="Пароль">
    <button class="auth-submit" id="authSubmit">Войти</button>
    <div class="auth-switch">
      <span id="toggleAuthMode">Нет аккаунта? Зарегистрироваться</span>
    </div>
  </div>
</div>

<script>
// =========================================
//  АНИМАЦИЯ ЗАГРУЗКИ (Замедленная и плавная)
// =========================================
const preloader = document.getElementById('preloader');
const sidebar = document.getElementById('sidebar');
const mainContent = document.getElementById('mainContent');

const hasSeenIntro = sessionStorage.getItem('mun_intro_seen');

if (hasSeenIntro) {
  preloader.classList.add('hidden');
  sidebar.classList.add('visible');
  mainContent.classList.add('visible');
} else {
  // 1. Через 0.3 сек иконка плавно начинает проявляться
  setTimeout(() => {
    preloader.classList.add('show-icon');
  }, 300);

  // 2. Через 1.8 сек плавно загораются глаза
  setTimeout(() => {
    preloader.classList.add('show-eyes');
  }, 1800);

  // 3. Через 3.5 сек прелоадер растворяется, выезжает сайдбар
  setTimeout(() => {
    preloader.classList.add('hidden');
    sidebar.classList.add('visible');
  }, 3500); 

  // 4. Через 4.2 сек плавно проявляется сам чат
  setTimeout(() => {
    mainContent.classList.add('visible');
    sessionStorage.setItem('mun_intro_seen', 'true');
  }, 4200);
}

// =========================================
//  ОСТАЛЬНАЯ ЛОГИКА (ЧАТ И Т.Д.)
// =========================================
const API = 'http://127.0.0.1:8000';
const messagesEl = document.getElementById('messages');
const promptEl = document.getElementById('prompt');
const sendBtn = document.getElementById('send');
const lawyerSwitch = document.getElementById('lawyerSwitch');
const pdfUpload = document.getElementById('pdfUpload');
const chatListEl = document.getElementById('chatList');
const newChatBtn = document.getElementById('newChatBtn');

// Модалка
const authModal = document.getElementById('authModal');
const userProfile = document.getElementById('userProfile');
const profileName = document.getElementById('profileName');
const profileStatus = document.getElementById('profileStatus');
const authTitle = document.getElementById('authTitle');
const authSubmit = document.getElementById('authSubmit');
const toggleAuthMode = document.getElementById('toggleAuthMode');
const userAvatar = document.getElementById('userAvatar');
let isRegisterMode = false;

// --- СОСТОЯНИЕ ---
let isLawyerMode = false;
let currentChatId = null;
let allChats = {}; // { id: { title, history: [] } }

// =========================================
//  ЛОКАЛЬНАЯ БАЗА (localStorage)
// =========================================
function loadState() {
  const savedChats = localStorage.getItem('mun_chats');
  if (savedChats) {
    allChats = JSON.parse(savedChats);
  }
  
  const currentId = localStorage.getItem('mun_current_chat');
  if (currentId && allChats[currentId]) {
    currentChatId = currentId;
  } else {
    createNewChat();
  }

  if (localStorage.getItem('mun_mode') === 'true') {
    isLawyerMode = true;
    lawyerSwitch.classList.add('active');
  }

  const user = localStorage.getItem('mun_user');
  if (user) {
    profileName.innerText = user;
    profileStatus.innerText = 'Онлайн';
    userAvatar.innerText = user.substring(0, 1).toUpperCase();
  }

  renderSidebar();
  renderMessages();
}

function saveState() {
  localStorage.setItem('mun_chats', JSON.stringify(allChats));
  localStorage.setItem('mun_current_chat', currentChatId);
  localStorage.setItem('mun_mode', isLawyerMode);
}

// =========================================
//  УПРАВЛЕНИЕ ЧАТАМИ
// =========================================
function createNewChat() {
  const id = 'chat_' + Date.now();
  allChats[id] = { title: 'Новый диалог', history: [] };
  currentChatId = id;
  saveState();
  if (chatListEl) renderSidebar();
  if (messagesEl) renderMessages();
}

function switchChat(id) {
  currentChatId = id;
  saveState();
  renderSidebar();
  renderMessages();
}

function deleteChat(id, e) {
  e.stopPropagation();
  if (allChats[id]) {
    delete allChats[id];
    if (currentChatId === id) {
      const keys = Object.keys(allChats);
      if (keys.length > 0) currentChatId = keys[0];
      else createNewChat();
    }
    saveState();
    renderSidebar();
    renderMessages();
  }
}

function renderSidebar() {
  chatListEl.innerHTML = '';
  Object.keys(allChats).reverse().forEach(id => {
    const chat = allChats[id];
    const div = document.createElement('div');
    div.className = 'chat-item' + (id === currentChatId ? ' active' : '');
    div.onclick = () => switchChat(id);
    
    const title = chat.title.length > 20 ? chat.title.substring(0, 20) + '...' : chat.title;
    
    div.innerHTML = `
      <span>${title}</span>
      <span class="delete-btn" onclick="deleteChat('${id}', event)">×</span>
    `;
    chatListEl.appendChild(div);
  });
}

function renderMessages() {
  messagesEl.innerHTML = '';
  const chat = allChats[currentChatId];
  
  if (!chat || chat.history.length === 0) {
    renderMessage('Привет. Я Мун. Твой локальный ассистент.<br><br>Включи «Режим Юриста», чтобы я стал строгим справочником по законам РФ.<br>Можешь загрузить PDF-договор (кнопка 📎), и я проверю его на риски.', 'bot');
  } else {
    chat.history.forEach(msg => {
      renderMessage(msg.content, msg.role === 'user' ? 'user' : 'bot');
    });
  }
}

function addToHistoryAndRender(text, who) {
  const chat = allChats[currentChatId];
  chat.history.push({ role: who === 'user' ? 'user' : 'assistant', content: text });
  
  if (who === 'user' && chat.history.filter(m => m.role === 'user').length === 1) {
    chat.title = text.substring(0, 30) + (text.length > 30 ? '...' : '');
    renderSidebar();
  }

  saveState();
  renderMessage(text, who);
}

// =========================================
//  РЕНДЕР СООБЩЕНИЙ
// =========================================
function renderMessage(text, who) {
  const wrapper = document.createElement('div');
  wrapper.className = 'msg-wrapper ' + who;

  const avatar = document.createElement('div');
  avatar.className = 'avatar ' + who;
  
  if (who === 'bot') {
    avatar.innerHTML = `<svg width="24" height="24" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="2" y="18" width="6" height="12" rx="2" fill="#333" />
      <rect x="40" y="18" width="6" height="12" rx="2" fill="#333" />
      <rect x="4" y="21" width="2" height="6" rx="1" fill="#fff" />
      <rect x="42" y="21" width="2" height="6" rx="1" fill="#fff" />
      <rect x="8" y="12" width="32" height="24" rx="8" fill="#e0e0e0" />
      <rect x="10" y="14" width="28" height="20" rx="6" fill="#050505" />
      <rect x="14" y="20" width="7" height="7" rx="2" fill="#ffffff" />
      <rect x="27" y="20" width="7" height="7" rx="2" fill="#ffffff" />
      <path d="M14 16C20 14 28 14 34 16" stroke="#333" stroke-width="1.5" stroke-linecap="round" />
    </svg>`;
  } else {
    avatar.innerHTML = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="12" cy="8" r="4" fill="#fff" />
      <path d="M4 20c0-4 4-7 8-7s8 3 8 7" stroke="#fff" stroke-width="2" stroke-linecap="round" />
    </svg>`;
  }

  const div = document.createElement('div');
  div.className = 'msg ' + who;
  
  if (who === 'bot') {
    div.innerHTML = text
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
        .replace(/^> (.*)$/gm, '<blockquote>$1</blockquote>')
        .replace(/\[(.*?)\]\((.*?)\)/g, '<a href="$2" target="_blank">$1</a>')
        .replace(/\n/g, '<br>');
  } else {
    div.textContent = text;
  }

  wrapper.appendChild(avatar);
  wrapper.appendChild(div);
  messagesEl.appendChild(wrapper);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}

function showTypingIndicator() {
  const wrapper = document.createElement('div');
  wrapper.className = 'msg-wrapper bot';
  
  const avatar = document.createElement('div');
  avatar.className = 'avatar bot';
  avatar.innerHTML = `<svg width="24" height="24" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="2" y="18" width="6" height="12" rx="2" fill="#333" />
      <rect x="40" y="18" width="6" height="12" rx="2" fill="#333" />
      <rect x="4" y="21" width="2" height="6" rx="1" fill="#fff" />
      <rect x="42" y="21" width="2" height="6" rx="1" fill="#fff" />
      <rect x="8" y="12" width="32" height="24" rx="8" fill="#e0e0e0" />
      <rect x="10" y="14" width="28" height="20" rx="6" fill="#050505" />
      <rect x="14" y="20" width="7" height="7" rx="2" fill="#ffffff" />
      <rect x="27" y="20" width="7" height="7" rx="2" fill="#ffffff" />
      <path d="M14 16C20 14 28 14 34 16" stroke="#333" stroke-width="1.5" stroke-linecap="round" />
    </svg>`;

  const div = document.createElement('div');
  div.className = 'msg bot';
  div.innerHTML = `<div class="typing-indicator"><span></span><span></span><span></span></div>`;

  wrapper.appendChild(avatar);
  wrapper.appendChild(div);
  messagesEl.appendChild(wrapper);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return wrapper;
}

// =========================================
//  СОБЫТИЯ
// =========================================
newChatBtn.onclick = createNewChat;

lawyerSwitch.onclick = () => {
  isLawyerMode = !isLawyerMode;
  lawyerSwitch.classList.toggle('active', isLawyerMode);
  saveState();
};

pdfUpload.onchange = async () => {
  const file = pdfUpload.files[0];
  if (!file) return;
  addToHistoryAndRender(`📄 Загружен файл: ${file.name}`, 'user');
  
  const typingWrapper = showTypingIndicator();
  const formData = new FormData();
  formData.append('file', file);
  
  try {
    const res = await fetch(API + '/analyze_pdf', { method: 'POST', body: formData });
    const data = await res.json();
    messagesEl.removeChild(typingWrapper);
    addToHistoryAndRender(data.text, 'bot');
  } catch (e) {
    messagesEl.removeChild(typingWrapper);
    addToHistoryAndRender('❌ Ошибка при загрузке PDF: ' + e.message, 'bot');
  }
};

async function send() {
  const prompt = promptEl.value.trim();
  if (!prompt) return;
  
  addToHistoryAndRender(prompt, 'user');
  promptEl.value = '';
  sendBtn.disabled = true;
  
  const typingWrapper = showTypingIndicator();
  const chat = allChats[currentChatId];

  try {
    let fullPrompt = prompt;
    if (isLawyerMode && chat.history.length > 1) {
      const historyText = chat.history.slice(-3, -1).map(m => `${m.role === 'user' ? 'Пользователь' : 'Мун'}: ${m.content}`).join('\n');
      if (historyText) {
        fullPrompt = `--- История ---\n${historyText}\n--- Конец ---\n\nПользователь: ${prompt}`;
      }
    }

    const res = await fetch(API + '/generate', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        prompt: fullPrompt,
        max_tokens: 1024,
        temperature: 0.7,
        top_p: 0.9,
        mode: isLawyerMode ? "lawyer" : "normal"
      })
    });
    const data = await res.json();
    messagesEl.removeChild(typingWrapper);
    addToHistoryAndRender(data.text, 'bot');
  } catch (e) {
    messagesEl.removeChild(typingWrapper);
    addToHistoryAndRender('❌ Ошибка: ' + e.message, 'bot');
  }
  sendBtn.disabled = false;
  promptEl.focus();
}

sendBtn.onclick = send;
promptEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    send();
  }
});

// =========================================
//  РЕГИСТРАЦИЯ / ВХОД (ЛОКАЛЬНАЯ БАЗА)
// =========================================
userProfile.onclick = () => {
  authModal.classList.add('active');
};

authModal.onclick = (e) => {
  if (e.target === authModal) authModal.classList.remove('active');
};

toggleAuthMode.onclick = () => {
  isRegisterMode = !isRegisterMode;
  authTitle.innerText = isRegisterMode ? 'Регистрация' : 'Вход';
  authSubmit.innerText = isRegisterMode ? 'Создать аккаунт' : 'Войти';
  toggleAuthMode.innerText = isRegisterMode ? 'Есть аккаунт? Войти' : 'Нет аккаунта? Зарегистрироваться';
};

authSubmit.onclick = () => {
  const login = document.getElementById('authLogin').value.trim();
  const pass = document.getElementById('authPassword').value.trim();
  
  if (!login || !pass) {
    alert('Заполните все поля');
    return;
  }

  const users = JSON.parse(localStorage.getItem('mun_users_db') || '{}');

  if (isRegisterMode) {
    if (users[login]) {
      alert('Пользователь с таким логином уже существует!');
      return;
    }
    
    users[login] = pass; 
    localStorage.setItem('mun_users_db', JSON.stringify(users));
    localStorage.setItem('mun_user', login);
    
    profileName.innerText = login;
    profileStatus.innerText = 'Онлайн';
    userAvatar.innerText = login.substring(0, 1).toUpperCase();
    
    authModal.classList.remove('active');
    document.getElementById('authPassword').value = '';
    alert('Аккаунт успешно создан!');
  } else {
    if (!users[login]) {
      alert('Пользователь не найден. Зарегистрируйтесь!');
      return;
    }
    
    if (users[login] !== pass) {
      alert('Неверный пароль!');
      return;
    }
    
    localStorage.setItem('mun_user', login);
    
    profileName.innerText = login;
    profileStatus.innerText = 'Онлайн';
    userAvatar.innerText = login.substring(0, 1).toUpperCase();
    
    authModal.classList.remove('active');
    document.getElementById('authPassword').value = '';
    alert('Вы успешно вошли!');
  }
};

// Инициализация
loadState();
</script>
